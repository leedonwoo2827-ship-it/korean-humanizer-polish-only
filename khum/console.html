<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>한국어 AI 윤문</title>
<style>
:root{
  --rail:#201e1b;--rail-fg:#efece5;--rail-mute:#b3aca1;--rail-dim:#8a8378;--rail-brand:#c9a46a;--rail-hover:#302e2b;--rail-active:#36302a;--rail-line:rgb(255 255 255/.09);
  --paper:#f7f5f1;--card:#fffdfa;--fg:#24211d;--mute:#6b645a;--line:#e4ded4;--brand:#8a5a2b;--wash:#f3ebe0;
  --ok:#2f6b3a;--okbg:#e5f1e3;--bad:#b42318;--badbg:#fbe9e6;--warn:#8a5a00;--warnbg:#fbf0d9;--log:#1b1916;--logfg:#e6e0d6;
  --ins:#dff3e1;--insfg:#1e5b2a;--del:#fbe1dd;--delfg:#a3271b;--s1:#f8d4cf;--s2:#f7e6c4;--s3:#e8e4dc}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#161412;--card:#1e1c19;--fg:#ece7df;--mute:#a59d91;--line:#34302b;--brand:#e0b27a;--wash:#2c251d;--ok:#7cc98a;--okbg:#1d2a1f;--bad:#ff8a7a;--badbg:#3a201c;--warn:#f1cf9c;--warnbg:#3a3020;--log:#0f0e0c;
  --ins:#1f3a24;--insfg:#9fe0ab;--del:#45231f;--delfg:#ffab9e;--s1:#5a2a24;--s2:#4f3f20;--s3:#3a3631}}
:root[data-theme="dark"]{--paper:#161412;--card:#1e1c19;--fg:#ece7df;--mute:#a59d91;--line:#34302b;--brand:#e0b27a;--wash:#2c251d;--ok:#7cc98a;--okbg:#1d2a1f;--bad:#ff8a7a;--badbg:#3a201c;--warn:#f1cf9c;--warnbg:#3a3020;--log:#0f0e0c;
  --ins:#1f3a24;--insfg:#9fe0ab;--del:#45231f;--delfg:#ffab9e;--s1:#5a2a24;--s2:#4f3f20;--s3:#3a3631}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--fg);font:13.5px/1.6 Pretendard,"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;display:flex}
.rail{width:262px;flex:none;background:var(--rail);color:var(--rail-fg);display:flex;flex-direction:column;height:100vh;position:sticky;top:0}
.brand{padding:18px 16px 14px;border-bottom:1px solid var(--rail-line)}
.brand b{font-size:16px;letter-spacing:-.2px}
.pill{background:#8a5a2b;color:#fff;font-weight:800;font-size:13px;border-radius:8px;padding:5px 10px}
.brand small{display:block;color:var(--rail-dim);font-size:11.5px;margin-top:6px}
.newbook{display:block;width:100%;margin-top:12px;background:var(--rail-brand);border:0;color:#2a1c0c;font-weight:800;font-size:15px;border-radius:22px;padding:10px 0;cursor:pointer}
.newbook:hover{background:#d8b580}
.nav{flex:1;overflow:auto;padding:10px 8px}
.nav a{display:flex;gap:8px;align-items:flex-start;padding:6px 10px;border-radius:8px;color:var(--rail-fg);text-decoration:none;margin:1px 0}
.nav a:hover{background:var(--rail-hover)}
.nav a.on{background:var(--rail-active);box-shadow:inset 3px 0 0 var(--rail-brand)}
.nav-no{font-weight:800;color:var(--rail-brand);min-width:24px;font-variant-numeric:tabular-nums;font-size:12.5px}
.nav-t{flex:1;min-width:0;overflow-wrap:anywhere}
.nav-t em{display:block;font-style:normal;font-size:11.5px;color:var(--rail-dim)}
.nav-sec{color:var(--rail-dim);font-size:11px;letter-spacing:.5px;padding:12px 10px 4px}
.chip{font-size:10.5px;border-radius:9px;padding:0 6px;background:rgb(255 255 255/.08);color:var(--rail-mute);white-space:nowrap}
.chip.ok{background:#2f4a33;color:#bfe3c3}.chip.warn{background:#4a3a26;color:#f1cf9c}.chip.bad{background:#4a2a26;color:#f4b3a8}
.rail-foot{border-top:1px solid var(--rail-line);padding:10px 14px;font-size:11.5px;color:var(--rail-dim)}
.rail-foot .bar{background:rgb(255 255 255/.1)}
.cxbtn{cursor:pointer;color:var(--rail-fg);padding:6px 8px;margin:0 -8px 6px;border-radius:8px;display:flex;gap:6px;align-items:center;white-space:nowrap}
.cxbtn:hover{background:var(--rail-hover)}
.cxmail{color:var(--rail-dim);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.cxmenu{background:var(--rail-hover);border-radius:8px;padding:8px 10px;margin:-2px -8px 8px;color:var(--rail-mute);overflow-wrap:anywhere}
.cxmenu button{background:transparent;color:var(--rail-fg);border-color:var(--rail-line);padding:3px 9px;font-size:12px}
.cxmenu button:hover{background:var(--rail-active)}
main{flex:1;min-width:0;height:100vh;overflow:auto;overflow-x:hidden}
.wrap{max-width:1180px;margin:0 auto;padding:22px 24px 60px}
h1{font-size:20px;margin:0}
.sub{color:var(--mute);margin:2px 0 14px;overflow-wrap:anywhere}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:12px 0}
.card h2{font-size:14.5px;margin:0 0 10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.n{display:inline-grid;place-items:center;min-width:22px;height:22px;border-radius:6px;background:var(--brand);color:#fff;font-size:12px;font-weight:700;padding:0 4px}
.mute{color:var(--mute)}
button,select,input,textarea{font:inherit;color:var(--fg)}
button{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 12px;cursor:pointer}
button:hover{background:var(--wash)}
button.primary{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:700}
button.big{font-size:14.5px;padding:9px 18px}
button:disabled{opacity:.5;cursor:not-allowed}
input[type=text],input[type=number],select,textarea{border:1px solid var(--line);border-radius:6px;padding:5px 8px;background:var(--card)}
textarea{width:100%;resize:vertical;line-height:1.6}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:110px minmax(0,1fr);gap:8px 12px;align-items:center}
.drop{display:block;border:1.5px dashed var(--line);border-radius:10px;padding:22px;text-align:center;margin:6px 0;cursor:pointer}
.drop.drag{border-color:var(--brand);background:var(--wash)}
.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:8px 0 6px}
.bar i{display:block;height:100%;width:0;background:var(--brand);transition:width .3s}
pre.log{background:var(--log);color:var(--logfg);border-radius:10px;padding:10px 12px;max-height:220px;overflow:auto;font:12px/1.5 Consolas,"D2Coding",monospace;white-space:pre-wrap;margin:0}
table{border-collapse:collapse;width:100%}
th,td{border-bottom:1px solid var(--line);padding:5px 6px;text-align:left;vertical-align:top;font-size:13px}
th{color:var(--mute);font-weight:600;white-space:nowrap}
.kpis{display:flex;gap:10px;flex-wrap:wrap;margin:4px 0 10px}
.kpi{border:1px solid var(--line);border-radius:10px;padding:6px 14px;min-width:110px;background:var(--paper)}
.kpi b{display:block;font-size:19px}
.grade{font-size:34px!important;line-height:1.1}
.gA{color:var(--ok)}.gB{color:var(--ok)}.gC{color:var(--warn)}.gD{color:var(--bad)}
.tag{font-size:11px;border-radius:9px;padding:1px 7px;background:var(--okbg);color:var(--ok);white-space:nowrap}
.tag.warn{background:var(--warnbg);color:var(--warn)}.tag.bad{background:var(--badbg);color:var(--bad)}.tag.plain{background:var(--paper);color:var(--mute);border:1px solid var(--line)}
.sev{font-size:11px;font-weight:700;border-radius:5px;padding:0 5px;white-space:nowrap}
.sev.S1{background:var(--s1)}.sev.S2{background:var(--s2)}.sev.S3{background:var(--s3)}
mark{background:none;border-radius:3px;padding:0 1px;color:inherit}
mark.S1{background:var(--s1)}mark.S2{background:var(--s2)}mark.S3{background:var(--s3)}
ins{background:var(--ins);color:var(--insfg);text-decoration:none;border-radius:2px}
del{background:var(--del);color:var(--delfg);border-radius:2px}
.para{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;padding:12px 4px;border-bottom:1px solid var(--line)}
.para:last-child{border-bottom:0}
.para .no{font-weight:800;color:var(--brand);font-variant-numeric:tabular-nums;text-align:right}
.para.off .body{opacity:.6}
.para .txt{white-space:pre-wrap;overflow-wrap:anywhere}
.para .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:6px;font-size:12px}
.para label.adopt{display:inline-flex;gap:5px;align-items:center;font-weight:700;cursor:pointer}
.para details{margin-top:6px}
.para details summary{cursor:pointer;color:var(--mute);font-size:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:4px 10px}
.seg button.on{background:var(--brand);color:#fff}
.checks{list-style:none;padding:0;margin:6px 0 0;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:2px 16px}
#toast{position:fixed;right:18px;top:16px;background:var(--fg);color:var(--paper);padding:9px 34px 9px 16px;border-radius:10px;display:none;max-width:min(460px,90vw);z-index:9;cursor:pointer;box-shadow:0 6px 24px rgb(0 0 0/.18)}
#toast::after{content:"✕";position:absolute;right:12px;top:9px;opacity:.6}
.alert{border:1px solid var(--bad);background:var(--badbg);color:var(--fg);border-radius:10px;padding:10px 14px;margin:8px 0;position:relative}
.alert b{color:var(--bad)}
.alert .x{position:absolute;right:8px;top:6px;border:0;background:none;font-size:15px;padding:2px 6px}
.alert code{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:2px 8px;font:12.5px Consolas,"D2Coding",monospace}
.alert details{margin-top:6px;color:var(--mute);font-size:12px;overflow-wrap:anywhere}
.note{background:var(--wash);border-radius:10px;padding:10px 14px;margin:8px 0;font-size:13px}
.iconbtn{padding:2px 7px;font-size:12px}
.empty{padding:30px;text-align:center;color:var(--mute)}
.dash td{vertical-align:middle}.dash tr.cur td{background:var(--wash)}.dash td.num,.dash th.num{text-align:right;font-variant-numeric:tabular-nums}
.dash a{color:var(--fg)}.dash tr.sub td{font-size:12.5px;border-bottom-style:dashed}.dash input[type=checkbox]{width:16px;height:16px;vertical-align:middle}
.warnbox{border:1px solid var(--warn);background:var(--warnbg);border-radius:10px;padding:8px 12px;margin:8px 0}
.engsel{width:100%;margin:2px 0 8px;background:var(--rail-hover);color:var(--rail-fg);border-color:var(--rail-line);font-size:12px}
@media (max-width:820px){body{display:block}.rail{width:auto;height:auto;position:static}.nav{max-height:240px}main{height:auto}.wrap{padding:16px}.grid2{grid-template-columns:1fr}}
</style></head>
<body>
<nav class="rail">
  <div class="brand"><div class="row" style="gap:8px"><span class="pill">AI 윤문</span><b>에이전트</b></div>
    <small>AI 티 진단 → 윤문 → 감사 → 등급 · korean-humanizer</small>
    <button class="newbook" onclick="location.hash='#/new'">＋ 새 글 넣기</button></div>
  <div class="nav" id="nav"></div>
  <div class="rail-foot" id="foot"></div>
</nav>
<main><div class="wrap" id="view"></div></main>
<div id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pct = r => Math.round(r*100)+"%";
const api = async (url, opt) => { const r = await fetch(url, opt); const j = await r.json().catch(()=>({error:"응답 오류"})); if(!r.ok || j.ok===false) throw new Error(j.error||r.status); return j };
function toast(t, ms=3500){ const e=$("toast"); e.textContent=t; e.style.display="block"; e.onclick=()=>e.style.display="none"; clearTimeout(e._t); e._t=setTimeout(()=>e.style.display="none",ms) }

let APP = null, DS = null, DEC = {}, timer = null, wasRunning = false, rendered = null, SEV = "all";
// #/d/<글>/<단계>  단계 = setup(① 원고) · result(③ 결과 보기) · errata(④ 정오표).  ② 만들기 = #/dash (대시보드)
const STAGE_NAV = [["setup","① 원고"], ["dash","② 만들기"], ["result","③ 결과 보기"], ["errata","④ 정오표"]];  // longform 의 ① 원고 ② 만들기 ③ 결과 보기 ④ 올리기
const route = () => { const m = location.hash.match(/^#\/d\/([^/]+)(?:\/(\w+))?$/);
  return m ? {view:"doc", id:decodeURIComponent(m[1]), stage:["setup","result","errata"].includes(m[2]) ? m[2] : "setup"} : location.hash === "#/dash" ? {view:"dash"} : {view:"new"} };
let PART = "all", KEEP = 0;  // 위쪽 절 탭: all 또는 절 번호 (KEEP: 대시보드에서 절을 눌러 들어올 때 유지)
const curId = () => { const r = route(); if(r.view === "doc") return r.id;
  let s = null; try{ s = localStorage.getItem("khum.doc") }catch(e){}
  return APP && APP.docs.some(d=>d.id===s) ? s : (APP && APP.docs.length ? APP.docs[APP.docs.length-1].id : null) };
window.addEventListener("hashchange", () => { rendered = null; const r = route();
  if(!DS || r.view !== "doc" || DS.doc.id !== r.id){ DS = null; if(!KEEP) PART = "all" }
  KEEP = 0;
  if(r.view === "doc") try{ localStorage.setItem("khum.doc", r.id) }catch(e){}
  refresh() });

async function refresh(){
  try{
    APP = await api("/api/state");
    if(!location.hash && APP.docs.length){ location.hash = "#/dash"; return }  // 책이 있으면 ② 만들기부터
    const r = route();
    const finished = wasRunning && !APP.job.running;
    if(r.view === "doc" && (!DS || DS.doc.id !== r.id || finished)){
      DS = await api("/api/doc?id="+encodeURIComponent(r.id)).catch(e=>{ toast(e.message); location.hash="#/new"; return null });
      if(DS){ DEC = JSON.parse(JSON.stringify(DS.decisions||{})); rendered = null }
    }
    renderNav(); renderView();
  }catch(e){ $("view").innerHTML = `<div class="empty">서버에 연결할 수 없습니다. run.bat 창이 열려 있는지 확인하고,<br>주소창에 <b>http://localhost:8767/</b> 를 입력해 보세요.</div>` }
  clearTimeout(timer); timer = setTimeout(refresh, APP && (APP.job.running || ["codex","claude"].some(k => APP[k] && (APP[k].checking || APP[k].login_open))) ? 1200 : 6000);
}

/* ---------- 왼쪽 ---------- */
function gchip(g){ return g ? `<span class="chip ${g<="B"?"ok":g==="C"?"warn":"bad"}">등급 ${g}</span>` : "" }
function renderNav(){
  const r = route();
  // 왼쪽: 단계 ① 원고 · ② 만들기 · ③ 결과 보기 · ④ 정오표 (longform 위쪽 탭을 옆으로). 책 고르기는 아래쪽(bookFoot)
  const id = curId(), d = APP.docs.find(x=>x.id===id);
  let h = "";
  if(d){
    const ps = d.parts || [], n = ps.length, doneN = st => ps.filter(pt => !(pt.left||{})[st]).length;
    const run = APP.batch.cur === d.id && APP.job.running;
    const sub = {setup: `${(d.chars||0).toLocaleString()}자 · ${d.genre || ""}`,
                 dash: run ? (APP.batch.waiting ? "⏸ 한도 대기 중" : "⏳ 진행 중") : "절을 골라 단계별로 돌리기",
                 result: n ? `진단 ${doneN("detect")} · 윤문 ${doneN("rewrite")} · 감사 ${doneN("audit")} / ${n}부분` : "",
                 errata: d.exported ? `반영 ${d.exported}` : "체크 · 반영 → 파일"};
    for(const [k, name] of STAGE_NAV){
      const href = k === "dash" ? "#/dash" : `#/d/${encodeURIComponent(d.id)}/${k}`;
      const on = k === "dash" ? r.view === "dash" : r.view === "doc" && r.id === d.id && r.stage === k;
      h += `<a href="${href}" class="${on?"on":""}"><span class="nav-no">${name[0]}</span>
        <span class="nav-t">${esc(name.slice(2))}<em>${esc(sub[k])}</em>${k==="result" && d.grade ? `<span class="row" style="margin-top:3px">${gchip(d.grade)}</span>` : ""}</span></a>`;
    }
  } else h += `<div class="nav-sec" style="letter-spacing:0">아직 글이 없습니다. 위의 「새 글 넣기」로 넣으세요.</div>`;
  if(!(document.activeElement && document.activeElement.tagName === "SELECT" && $("nav").contains(document.activeElement))) $("nav").innerHTML = h;
  const j = APP.job;
  if(document.activeElement && document.activeElement.tagName === "SELECT" && $("foot").contains(document.activeElement)) return;  // 엔진을 고르는 중엔 다시 그리지 않는다
  $("foot").innerHTML = bookFoot() + engineFoot() + acctFoot("codex") + acctFoot("claude") + (j.name ? `<div>${j.running ? "⏳" : (j.error ? "⚠" : "✓")} ${esc(j.name)}${j.uid ? " · "+esc(j.uid) : ""}</div><div class="bar"><i style="width:${progress(j)}%"></i></div>` : "")
    + `<div title="${esc(APP.workspace)}">워크스페이스: ${esc(APP.workspace.split(/[\\/]/).slice(-2).join("/"))}</div>`;
  if(wasRunning && !j.running) toast(j.error ? ({auth:"⚠ Codex 로그인 만료", claude_auth:"⚠ Claude 로그인 만료", limit:"⚠ 사용 한도", cancel:"멈췄습니다"}[j.error_kind] || "⚠ "+j.name+" 중단") + " — 화면의 안내를 확인하세요" : j.name+" 끝", 6000);
  wasRunning = j.running;
}
function progress(j){
  if(!j.name) return 0;
  if(!j.running) return 100;
  // 로그 머리줄 "[탐지] … N구간을 Codex로" / "[윤문] … N구간을 Claude로" 와 구간별 줄 수로 센다
  if(isBatch(j)){ const b = APP.batch; return Math.min(97, 3 + 94*Object.keys(b.done).length/(b.ids.length||1)) }
  const total = kind => { const m = j.log.map(l=>l.match(new RegExp("^\\["+kind+"\\] .*?(\\d+)구간을 "))).filter(Boolean).pop(); return m ? +m[1] : 0 };
  const done = kind => j.log.filter(l=>new RegExp("^\\s+\\["+kind+"\\] 구간").test(l)).length;
  const nd = total("탐지"), nr = total("윤문");
  const det = nd ? Math.min(1, done("탐지")/nd) : 0;
  if(j.name === "AI 흔적 진단") return Math.min(97, 4 + 93*det);
  const rw = nr ? Math.min(1, (0.7*done("윤문") + 0.3*done("감사"))/nr) : 0;
  return Math.min(97, nd ? 3 + 30*det + 64*rw : 3 + 94*rw);
}

function renderView(){
  const r = route();
  if(r.view === "new") return renderNew();
  if(r.view === "dash") return renderDash();
  if(DS) return renderDoc();
}

/* ---------- 새 글 넣기 ---------- */
function renderNew(){
  if(rendered === "new"){ return }
  rendered = "new";
  const bk = APP.backups;
  $("view").innerHTML = `<h1>새 글 넣기</h1>
  <div class="sub">AI 도움을 받아 쓴 원고를 넣으면, 'AI 티'가 나는 곳을 찾아 표시하고(진단) 사람 글로 다듬어 줍니다(윤문).</div>
  <div class="card"><h2><span class="n">1</span>파일로 넣기 <span class="mute" style="font-weight:400">— 워드(.docx) · 텍스트(.txt · .md) · PDF</span></h2>
    <label class="drop" id="drop"><input type="file" id="file" accept=".docx,.txt,.md,.pdf,.hwp,.hwpx" hidden onchange="upload(this.files[0])">
      <div style="font-size:15px;font-weight:700">여기에 파일을 끌어다 놓거나, 눌러서 고르세요</div>
      <div class="mute">한글(.hwp) 파일은 한글에서 <b>다른 이름으로 저장 → Word 문서(.docx)</b> 로 바꿔서 올려 주세요.</div></label>
  </div>
  <div class="card"><h2><span class="n">2</span>붙여넣어 넣기</h2>
    <div class="row" style="margin-bottom:6px"><input type="text" id="ptitle" placeholder="제목 (비우면 첫 줄로)" style="flex:1;min-width:200px"></div>
    <textarea id="ptext" rows="10" placeholder="ChatGPT · Claude · Gemini 로 쓴 초안이나 원고를 붙여넣으세요. 문단은 빈 줄로 나눕니다."></textarea>
    <div class="row" style="margin-top:8px"><button class="primary" onclick="paste()">이 글로 시작</button><span class="mute" id="pcount"></span></div>
  </div>
  <div class="note"><b>이 도구가 하는 일은 '윤문'까지입니다.</b> 이미 쓴 문장의 번역투 · 상투어 · 과한 꾸밈을 걷어 내고, 뜻 · 사실 · 수치 · 고유명사는 그대로 둡니다.
    자료 조사와 사실 확인, 내용 보강, 분량을 채우는 일은 글쓴이의 몫으로 남겨 둡니다.</div>
  ${bk.length ? `<div class="card"><h2><span class="n">↺</span>보관한 글</h2><table><tbody>${bk.map(b=>`<tr><td>${esc(b.id)}</td><td>${esc(b.title)}</td><td class="mute">${esc(b.name.slice(0,15))}</td>
    <td style="text-align:right"><button class="iconbtn" onclick="restoreDoc('${esc(b.name)}')">다시 꺼내기</button></td></tr>`).join("")}</tbody></table></div>` : ""}`;
  const dz = $("drop");
  dz.ondragover = e => { e.preventDefault(); dz.classList.add("drag") };
  dz.ondragleave = () => dz.classList.remove("drag");
  dz.ondrop = e => { e.preventDefault(); dz.classList.remove("drag"); upload(e.dataTransfer.files[0]) };
  $("ptext").oninput = () => { const t = $("ptext").value; $("pcount").textContent = t ? `공백 포함 ${t.length.toLocaleString()}자 · 제외 ${t.replace(/\s/g,"").length.toLocaleString()}자` : "" };
}
async function upload(f){
  if(!f) return; toast(`${f.name} 읽는 중…`, 8000);
  try{ const j = await api("/api/new",{method:"POST",headers:{"X-Filename":encodeURIComponent(f.name),"Content-Type":"application/octet-stream"},body:f});
    toast("글을 넣었습니다. 장르를 확인하고 [AI 흔적 진단]을 누르세요.", 6000); location.hash = "#/d/"+j.doc.id;
  }catch(e){ toast("실패: "+e.message, 9000) }
}
async function paste(){
  const text = $("ptext").value.trim(); if(!text) return toast("글을 붙여넣어 주세요.");
  try{ const j = await api("/api/new",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({title:$("ptitle").value, text})});
    location.hash = "#/d/"+j.doc.id;
  }catch(e){ toast("실패: "+e.message, 9000) }
}
async function restoreDoc(name){ try{ const j = await api("/api/restore",{method:"POST",body:JSON.stringify({name})}); location.hash="#/d/"+j.doc.id; toast("다시 꺼냈습니다.") }catch(e){ toast(e.message, 8000) } }

/* ---------- 글 화면 ---------- */
function marked(text, items){
  // 원문 구절에 형광펜 (겹치면 앞의 것만)
  const spans = [];
  for(const it of items){ const k = text.indexOf(it.old_text); if(k<0) continue;
    if(spans.some(s => k < s.e && k + it.old_text.length > s.s)) continue;
    spans.push({s:k, e:k+it.old_text.length, it}) }
  spans.sort((a,b)=>a.s-b.s);
  let out = "", at = 0;
  for(const s of spans){ out += esc(text.slice(at, s.s)) + `<mark class="${s.it.severity}" title="${esc(s.it.code+" "+(DS.codes[s.it.code]||{}).name+" — "+s.it.reason)}">${esc(text.slice(s.s, s.e))}</mark>`; at = s.e }
  return out + esc(text.slice(at));
}
const adoptOf = p => { const d = DEC[p.i]; return d && "adopt" in d ? d.adopt : p.adopt_default };
const textOf = p => (DEC[p.i] && DEC[p.i].text) || p.text;

/* 위쪽 절 탭 — 단계 화면(②③④)에서 고른 절만 보여 준다 */
function partTabs(){
  if(DS.parts.length < 2) return "";
  const b = (APP.docs.find(x=>x.id===DS.doc.id) || {}).parts || [];
  const mark = k => { const pt = b.find(x=>x.k===k); return pt && !pt.todo.length ? " ✓" : "" };
  return `<div class="seg" style="flex-wrap:wrap;margin:0 0 10px">${[["all","전체"], ...DS.parts.map(pt=>[String(pt.k), pt.title.replace(/^(제?\d+\s*[절장부])\s.*$/, "$1").slice(0,14)])]
    .map(([k,t])=>`<button class="${PART===k?"on":""}" onclick="PART='${k}';EF.show=200;rendered=null;renderDoc()" title="${esc(k==="all"?"책 전체":(DS.parts.find(p=>String(p.k)===k)||{}).title||"")}">${esc(t)}${k==="all"?"":mark(+k)}</button>`).join("")}</div>`;
}
const partRange = () => { const pt = PART === "all" ? null : DS.parts.find(x => String(x.k) === PART); return pt ? [pt.start, pt.end] : [1, DS.paras.length] };
const inPart = i => { const [a, b] = partRange(); return a <= i && i <= b };

      <div><h1>${esc(STAGE_NAV.find(s=>s[0]===stage)[1])} <span class="mute" style="font-weight:400;font-size:15px">· ${esc(d.id)} ${esc(d.title)}</span></h1>
        <div class="sub">${esc(d.source||"")} · 문단 ${DS.paras.length}개 · 공백 포함 ${DS.paras.join("\n\n").length.toLocaleString()}자 · ${esc(d.created||"")}</div></div>
      <div class="row"><button onclick="openDir('')">폴더 열기</button><button onclick="archiveDoc()" ${busy?"disabled":""} title="backup 폴더로 옮깁니다 (지우지 않음)">보관</button></div></div>`;
  if(stage !== "setup"){

    <div class="card"><h2><span class="n">1</span>글 설정 <span class="mute" style="font-weight:400">— 진단·윤문 전에 확인하세요</span></h2>
      <div class="grid2">
        <span>제목</span><input type="text" id="m_title" value="${esc(d.title)}">
        <span>장르</span><select id="m_genre">${APP.genres.map(g=>`<option ${g===d.genre?"selected":""}>${esc(g)}</option>`).join("")}</select>
        <span>목표 글자수</span><div class="row"><input type="number" id="m_chars" min="0" step="50" value="${t.chars||""}" placeholder="비우면 원문 분량 유지" style="width:200px">
          <label><input type="checkbox" id="m_nospace" ${t.no_space?"checked":""}> 공백 제외로 셈</label>
          <label><input type="checkbox" id="m_strict" ${t.tol===0.02?"checked":""}> 정확히(±2%)</label>
          <span class="mute">기본 ±5%. 늘릴 때도 없는 사실은 지어내지 않습니다.</span></div>
        <span>문체 샘플</span><details ${d.voice?"open":""}><summary class="mute">선택 — 글쓴이가 직접 쓴 글을 붙여넣으면 그 말투로 다듬습니다</summary>
          <textarea id="m_voice" rows="5" placeholder="저자가 직접 쓴 글 한두 문단">${esc(d.voice||"")}</textarea></details>
      </div>
      <div class="row" style="margin-top:8px"><button onclick="saveMeta(true)">설정 저장</button></div>
    </div>
    <div class="card"><h2><span class="n">2</span>실행</h2>
      <div class="row">
        <button class="big" onclick="run('detect')" ${busy?"disabled":""}>① AI 흔적 진단만</button>
        <button class="big primary" onclick="run('rewrite')" ${busy?"disabled":""}>② 윤문하기 (진단 → 윤문 → 감사)</button>

      </div>
      ${busy ? `<div class="row" style="margin-top:8px"><button onclick="stopJob()">■ 멈춤</button><span class="mute">끝난 구간은 기억해 두므로 다시 누르면 이어서 합니다.</span></div>` : ""}
      <div class="mute" style="margin-top:6px">엔진: ${esc(APP.engines[APP.settings.engine])} · 이 글을 처음부터 하면 호출 약 ${calls(docChars(), ["detect","rewrite"])}회.
        한 번 한 구간은 기억해 두므로 다시 눌러도 빠릅니다. 창을 닫아도 계속 진행됩니다. 여러 편을 무인으로 돌리려면 <a href="#/dash">대시보드</a>를 쓰세요.</div>

function renderSummary(){
  const s = DS.summary; if(!s) return "";
  const f = s.found;
  let h = `<div class="kpis">`;
  if(s.grade) h += `<div class="kpi"><span class="mute">등급</span><b class="grade g${s.grade}">${s.grade}</b></div>
    <div class="kpi"><span class="mute">변경률</span><b class="${s.rate>.5?"bad":s.rate>.3?"warn":""}">${pct(s.rate)}</b></div>
    ${s.n_edits != null ? `<div class="kpi"><span class="mute">체크한 수정 (정오표)</span><b>${s.checked} / ${s.n_edits}</b></div>`
      : `<div class="kpi"><span class="mute">채택 문단</span><b>${s.adopted} / ${s.n_paras}</b></div>`}
    <div class="kpi"><span class="mute">남은 흔적</span><b>S1 ${s.residual.S1} · S2 ${s.residual.S2}</b></div>`;
  h += `<div class="kpi"><span class="mute">찾은 흔적 (원문)</span><b>S1 ${f.S1} · S2 ${f.S2} · S3 ${f.S3}</b></div>
    <div class="kpi"><span class="mute">글자수 (공백 포함/제외)</span><b>${s.final_chars ? `${s.final_chars.with_space.toLocaleString()} / ${s.final_chars.no_space.toLocaleString()}` : `${s.orig_chars.with_space.toLocaleString()} / ${s.orig_chars.no_space.toLocaleString()}`}</b>
      ${s.final_chars ? `<span class="mute" style="font-size:11.5px">원문 ${s.orig_chars.with_space.toLocaleString()} / ${s.orig_chars.no_space.toLocaleString()}</span>` : ""}</div>`;
  if(s.target) h += `<div class="kpi"><span class="mute">목표 ${s.target.chars.toLocaleString()}자</span><b class="${s.target.ok?"ok":"bad"}">${s.target.actual.toLocaleString()} ${s.target.ok?"✓":"✗"}</b></div>`;
  h += `</div>`;
  if(s.grade){
    h += `<div class="note"><b>${s.grade}</b> — ${esc(s.advice)}${s.lost.length ? `<br><span class="bad">⚠ 채택한 문단에서 원문의 <b>${esc(s.lost.join(", "))}</b> 이(가) 보이지 않습니다. 확인하세요.</span>` : ""}</div>
      <ul class="checks">${Object.entries(s.selfcheck).map(([k,v])=>`<li>${v?'<span class="ok">✓</span>':'<span class="bad">✗</span>'} ${esc(k)}</li>`).join("")}</ul>`;
  } else {
    h += `<div class="note">진단만 한 상태입니다. 색칠된 곳이 AI 티가 나는 구절입니다 (<span class="sev S1">S1</span> 한 번만 나와도 AI 확신 · <span class="sev S2">S2</span> 3회 넘게 반복되면 손볼 것 · <span class="sev S3">S3</span> 다른 흔적과 겹칠 때만). 고치려면 [② 윤문하기]를 누르세요.</div>`;
  }
  return h;
}

let RV = "audit";  // ③ 결과 보기 안의 보기: audit(감사 · 남은 흔적) · detect(진단 · 찾은 흔적)
function renderResult(){
  const el = $("result"); if(!el) return;
  const stage = route().stage;
  if(!DS.detect){ el.innerHTML = `<div class="card empty">아직 진단 전입니다. 왼쪽 ① 원고 · 설정에서 실행하거나, <a href="#/dash">대시보드</a>에서 절을 골라 「1 진단」을 누르세요.</div>`; return }
  const det = DS.detect, rw = DS.rewrite;
  const where = i => (DS.pages[i-1] ? `p.${DS.pages[i-1]} · ` : "") + `문단 ${i}`;
  const span = c => [c.ids[0], c.ids[c.ids.length-1]];
  const inRange = c => { const [a, b] = span(c), [lo, hi] = partRange(); return a <= hi && b >= lo };
  // 정오표 방식(rw.edits)에서 예전 형식(fmt 없음) 구간 기록은 실패가 아니라 '아직 안 함'
  const old = c => rw && rw.edits && !c.fmt;
  const RVd = RV === "detect" || !rw;
  const recs = (RVd ? det.chunks : rw.notes).filter(inRange);
  const fails = recs.filter(c=>c.failed && !old(c)).length, pend = recs.filter(c=>c.pending || old(c)).length;
  const alerts = `${fails ? `<div class="alert"><b>⚠ 이 범위에서 ${fails}개 구간이 실패했습니다.</b> 같은 단계를 다시 누르면 실패한 구간만 다시 합니다.</div>` : ""}
    ${pend ? `<div class="note">이 범위에 아직 ${RVd ? "진단" : "윤문"}하지 않은 구간이 ${pend}개 있습니다. <a href="#/dash">대시보드</a>에서 절을 골라 이어서 하세요.</div>` : ""}`;
  let h = "";
  if(stage === "result"){
    h += `<div class="card"><h2>결과 · 등급 <span class="mute" style="font-weight:400">— 책 전체 기준 (절을 다 끝내야 제 등급이 나옵니다)</span></h2><div id="sum">${renderSummary()}</div></div>
      <div class="seg" style="margin:0 0 10px">${[["audit","감사 · 남은 흔적"],["detect","진단 · 찾은 흔적"]].map(([k,t])=>`<button class="${RV===k?"on":""}" onclick="RV='${k}';EF.show=200;renderResult()">${t}</button>`).join("")}</div>`;
  }
  if(stage === "result" && RVd){
    const all = det.items.filter(x => inPart(x.para)), items = all.filter(x => SEV==="all" || x.severity===SEV);
    const counts = {}; for(const x of all) counts[x.code] = (counts[x.code]||0)+1;
    const ch = det.chunks.filter(inRange);
    h += alerts + `<div class="card"><h2>찾은 AI 흔적 ${all.length}건 <span class="mute" style="font-weight:400">(원문 기준${PART==="all"?" · 책 전체":""})</span>
        <span class="seg">${["all","S1","S2","S3"].map(s=>`<button class="${SEV===s?"on":""}" onclick="SEV='${s}';renderResult()">${s==="all"?"전체":s}</button>`).join("")}</span></h2>
      <div class="row" style="margin-bottom:8px">${Object.entries(counts).sort((a,b)=>b[1]-a[1]).map(([c,n])=>`<span class="tag plain" title="${esc((DS.codes[c]||{}).fix||"")}">${esc(c)} ${esc((DS.codes[c]||{}).name||"")} ×${n}</span>`).join("")}</div>
      <table><thead><tr><th>쪽 · 문단</th><th>분류</th><th>심각도</th><th>원문 구절</th><th>이유</th></tr></thead><tbody>
      ${items.slice(0, EF.show).map(x=>`<tr><td style="white-space:nowrap">${where(x.para)}</td><td title="${esc((DS.codes[x.code]||{}).name||"")}">${esc(x.code)}<div class="mute" style="font-size:11px">${esc(DS.groups[x.code[0]]||"")}</div></td>
        <td><span class="sev ${x.severity}">${x.severity}</span></td><td>${esc(x.old_text)}</td><td>${esc(x.reason)}${x.source==="rule"?' <span class="tag plain">규칙</span>':""}</td></tr>`).join("") || `<tr><td colspan="5" class="mute">없습니다.</td></tr>`}
      </tbody></table>
      ${items.length > EF.show ? `<div class="row" style="margin-top:8px"><button onclick="EF.show+=200;renderResult()">더 보기 (${items.length - EF.show}건 남음)</button></div>` : ""}</div>
    <div class="card"><h2>구간별 진단 ${ch.length}구간</h2><table><thead><tr><th>범위</th><th>트리아지</th><th>요약</th></tr></thead><tbody>
      ${ch.map(c=>`<tr><td style="white-space:nowrap">${where(span(c)[0])} – ${span(c)[1]}</td><td>${c.failed ? '<span class="tag bad">실패</span>' : c.pending ? '<span class="tag plain">아직</span>' : esc(c.triage)}</td><td>${esc(c.summary)}</td></tr>`).join("")}</tbody></table></div>`;
  }
  if(stage === "result" && !RVd){
    h += alerts;
    if(rw){
      const rows = rw.paras.filter(p => inPart(p.i)), left = rows.flatMap(p => p.residual||[]);
      const notes = rw.notes.filter(inRange);
      const st = n => n.failed && !old(n) ? '<span class="tag bad">실패</span>' : n.pending || old(n) ? '<span class="tag plain">아직</span>'
        : (n.audited ?? !!n.audit) ? '<span class="tag">✓ 감사</span>' : '<span class="tag warn">감사 전</span>';
      h += `<div class="card"><h2>구간 기록 ${notes.length}구간</h2><table><thead><tr><th>범위</th><th>상태</th><th>윤문</th><th>감사</th></tr></thead><tbody>
        ${notes.map(n=>`<tr><td style="white-space:nowrap">${where(n.ids[0])} – ${n.ids[1]}</td><td>${st(n)}</td><td>${esc(n.note)}</td><td>${esc(n.audit||"")}</td></tr>`).join("")}</tbody></table></div>
        <div class="card"><h2>남은 흔적 ${left.length}건 <span class="mute" style="font-weight:400">— 수정 후보를 모두 반영했다고 보고 다시 찾은 것</span></h2>
        <table><thead><tr><th>쪽 · 문단</th><th>분류</th><th>심각도</th><th>구절</th><th>이유</th></tr></thead><tbody>
        ${left.slice(0, 300).map(x=>`<tr><td style="white-space:nowrap">${where(x.para)}</td><td>${esc(x.code)}</td><td><span class="sev ${x.severity}">${x.severity}</span></td><td>${esc(x.old_text)}</td><td>${esc(x.reason)}</td></tr>`).join("") || `<tr><td colspan="5" class="mute">없습니다.</td></tr>`}
        </tbody></table></div>`;
    } else h += `<div class="card empty">아직 윤문 전입니다. <a href="#/dash">대시보드</a>에서 「2 윤문」 · 「3 감사」를 누르세요.</div>`;
  }
  if(stage === "errata"){
    if(rw && rw.edits) h += alerts + editsCard();
    else if(rw){
      const byPara = {}; for(const x of det.items) (byPara[x.para] = byPara[x.para]||[]).push(x);
      h += `<div class="note">이 글은 예전 방식(문단을 통째로 다시 쓰기)으로 윤문한 결과입니다. <a href="#/dash">대시보드</a>에서 절을 골라 「2 윤문」을 다시 누르면 정오표 방식(수정 후보 · 확률)으로 바뀝니다.</div>
      <div class="card"><h2>문단 대조 · 고를 것</h2>
        <div class="row" style="margin-bottom:6px"><button class="iconbtn" onclick="setAll(true)">모두 채택</button><button class="iconbtn" onclick="setAll(false)">모두 원문 유지</button><button class="iconbtn" onclick="setAll(null)">기본값으로</button></div>
        <div id="paras">${rw.paras.filter(p=>inPart(p.i)).slice(0, EF.show).map(p => paraHtml(p, byPara[p.i]||[])).join("")}</div>
        <div class="row" style="margin-top:12px"><button class="big primary" onclick="exportDoc()">반영 → 윤문본 만들기</button></div>${filesHtml()}</div>`;
    } else h += `<div class="card empty">아직 윤문 전입니다. <a href="#/dash">대시보드</a>에서 절을 골라 「2 윤문」을 누르면 수정 후보가 여기에 나옵니다.
      <div class="row" style="justify-content:center;margin-top:10px"><button onclick="exportDoc()">진단표만 내려받기 (xlsx)</button></div>${filesHtml()}</div>`;
  }
  el.innerHTML = h;

  </div></div>`;

/* ---------- 대시보드: 고른 글·절에 단계 버튼 (1 진단 · 2 윤문 · 3 감사 · 4 반영) ---------- */
// PICK = {"01:0", "01:3", …}  글번호:절번호. 짧은 글은 절이 하나(0)라 글 체크 = 그 절 체크
let PICK = (()=>{ try{ return new Set(JSON.parse(localStorage.getItem("khum.pick")||"[]")) }catch(e){ return new Set() } })();
const FOLD = new Set();  // 접어 둔 글
const savePick = () => { try{ localStorage.setItem("khum.pick", JSON.stringify([...PICK])) }catch(e){} };
const STAGES = [["detect","1 진단"], ["rewrite","2 윤문"], ["audit","3 감사"]];
// Codex · 3개 동시 · 6,000자 구간에서 3구간(한 바퀴)에 걸리는 어림 분 — README 표와 같은 셈. 실측 뒤 고칠 것
const ROUND_MIN = {detect:1, rewrite:1.4, audit:1};
const DONE = {ok:["ok","끝"], part:["warn","일부 남음"], limit:["warn","한도로 멈춤"], stop:["bad","멈춤"], fail:["bad","실패"]};
const isBatch = j => !!j.name && !j.uid && APP.batch.ids.length > 0;
const pkey = (d, pt) => d.id + ":" + pt.k;
const partsOf = d => d.parts && d.parts.length ? d.parts : [{k:0, title:"전체", start:1, end:0, chars:d.chars||0, todo:d.todo||[], left:{}}];
const pickedParts = d => partsOf(d).filter(pt => PICK.has(pkey(d, pt)));
const inBatch = (d, pt) => { const b = APP.batch, ks = b.parts[d.id]; return b.ids.includes(d.id) && (ks == null || ks.includes(pt.k)) };
const segs = ch => ch ? Math.ceil(ch / APP.chunk) : 0;
const leftSegs = (pts, st) => pts.reduce((a,pt)=>a+segs((pt.left||{})[st]), 0);
const estMin = (n, st) => n ? Math.max(1, Math.round(Math.ceil(n/3) * ROUND_MIN[st])) : 0;
function stageCell(d, pts, st){
  const n = leftSegs(pts, st), b = APP.batch, run = APP.job.running && isBatch(APP.job);
  if(run && b.cur === d.id && b.steps.includes(st) && n && pts.some(pt => inBatch(d, pt)))
    return b.waiting ? `<span class="tag warn" title="${esc(b.waiting)}에 다시">⏸ 한도 대기</span>` : `<span class="tag warn">⏳ ${n}구간</span>`;
  return n ? `<span class="tag plain" title="약 ${estMin(n, st)}분 (Codex 어림)">${n}구간</span>` : `<span class="tag">✓</span>`;
}
function acctLine(){
  const one = k => { const c = APP[k] || {}, A = ACCT[k];
    const dot = c.verified ? "var(--ok)" : (c.verified === false || c.logged_in === false) ? "var(--bad)" : "var(--warn)";
    return `<span><span style="color:${dot}">●</span> ${A.name}${c.email ? " · "+esc(c.email) : ""}${c.plan ? " · <b>"+esc(c.plan)+"</b>" : ""}${c.logged_in === false ? " · 로그인 필요" : ""}</span>` };
  return `<div class="row mute" style="gap:16px;margin:-6px 0 10px;font-size:12.5px">${one("codex")}${one("claude")}<span>엔진: <b>${esc(APP.engines[APP.settings.engine])}</b></span></div>`;
}
const BOOKS = () => APP.docs.filter(d => d.id === curId());  // 대시보드는 작업할 책(좌하단) 하나만
function renderDash(){
  const j = APP.job, run = j.running;
  const keys = new Set(BOOKS().flatMap(d => partsOf(d).map(pt => pkey(d, pt))));
  for(const k of [...PICK]) if(!keys.has(k)) PICK.delete(k);
  const key = "dash|" + JSON.stringify([BOOKS(), APP.batch, run, j.name, j.error, APP.settings, APP.codex, APP.claude, [...PICK], [...FOLD], ALERT_OFF]);
  if(rendered === key){ dashLog(); return }
  rendered = key;
  const docs = BOOKS().filter(d => pickedParts(d).length);
  const sel = docs.flatMap(d => pickedParts(d));
  const all = BOOKS().flatMap(d => partsOf(d));
  const doneN = st => all.filter(pt => !(pt.left||{})[st]).length;
  const s = APP.settings, dis = run ? "disabled" : "";
  const kpi = (t, v, sub) => `<div class="kpi"><span class="mute">${t}</span><b>${v}</b>${sub ? `<span class="mute" style="font-size:11.5px">${sub}</span>` : ""}</div>`;
  const btn = (steps, label, cls="") => { const n = steps.filter(st=>st!=="export").reduce((a,st)=>a+leftSegs(sel, st), 0);
    const m = steps.filter(st=>st!=="export").reduce((a,st)=>a+estMin(leftSegs(sel, st), st), 0);
    return `<button class="${cls}" onclick="runSteps(${esc(JSON.stringify(steps))})" ${run || !sel.length ? "disabled" : ""}
      title="${steps.includes("export") && steps.length === 1 ? "정오표(엑셀 · 검토 PDF/HTML · 게시판)를 책 전체 한 번에 만듭니다 (호출 없음)" : `고른 부분: 호출 약 ${n}회 · Codex 약 ${m}분`}">${label}</button>` };
  const docRow = d => {  // 고른 책의 절만 행으로 (책 이름 행은 두지 않는다)
    const ps = partsOf(d);
    return ps.map(pt => `<tr class="${APP.batch.cur===d.id && run && inBatch(d, pt) && pt.todo.length ? "cur" : ""}">
      <td><input type="checkbox" ${PICK.has(pkey(d,pt))?"checked":""} ${dis} onchange="pick('${esc(pkey(d,pt))}',this.checked)"></td>
      <td class="mute">${pt.k}</td><td>${esc(pt.title)} <span class="mute" style="font-size:12px">· ${pt.end ? `문단 ${pt.start}–${pt.end}` : ""}</span></td>
      <td class="num">${(pt.chars||0).toLocaleString()}</td>
      ${STAGES.map(([k]) => `<td>${stageCell(d, [pt], k)}</td>`).join("")}
      <td>${pt.todo && !pt.todo.length ? `<a href="#/d/${encodeURIComponent(d.id)}/errata" onclick="PART='${pt.k}';KEEP=1"><span class="tag">체크하러 가기 →</span></a>` : '<span class="mute">-</span>'}</td></tr>`).join("");
  };
  $("view").innerHTML = `<h1>② 만들기 <span class="mute" style="font-weight:400;font-size:15px">· ${esc(BOOKS()[0] ? BOOKS()[0].id+" "+BOOKS()[0].title : "")}</span></h1>
    <div class="sub">글이나 절을 체크하고 단계 버튼을 누르면 고른 부분에만 그 단계를 합니다. 단계를 나눠 두었으니 <b>Codex 한도를 다른 일과 나눠 쓰며 시간대를 갈라 돌릴 수</b> 있습니다.
      한 단계 버튼은 그 단계만 하고(앞 단계가 안 된 곳은 건너뜀), ▶ 버튼은 앞 단계부터 차례로 합니다. 이미 된 곳은 건너뛰고, 실패한 구간만 다시 합니다.</div>
    ${acctLine()}
    <div class="kpis">${kpi("절", all.length+"부분", BOOKS()[0] ? esc(BOOKS()[0].title.slice(0,20)) : "")}${kpi("1 진단", doneN("detect")+" / "+all.length)}${kpi("2 윤문", doneN("rewrite")+" / "+all.length)}${kpi("3 감사", doneN("audit")+" / "+all.length)}${kpi("4 정오표", BOOKS()[0] && BOOKS()[0].exported ? "반영" : "-", BOOKS()[0] && BOOKS()[0].exported ? esc(BOOKS()[0].exported) : "아직 안 만듦")}</div>
    <div class="card">
      <div class="row" style="gap:6px">
        <b>고른 편에</b> <span class="mute">(${sel.length ? `${docs.length}편 ${sel.length}부분` : "아직 안 골랐어요"})</span>
        ${btn(["detect"], "1 진단")}${btn(["rewrite"], "2 윤문")}${btn(["audit"], "3 감사")}${btn(["export"], "4 정오표")}
        <span class="mute">|</span>${btn(["detect","rewrite","audit"], "▶ 1→3", "primary")}${btn(["detect","rewrite","audit","export"], "▶ 1→4", "primary")}
        ${run && isBatch(j) ? `<button onclick="stopJob()">■ 멈춤</button>` : ""}
      </div>
      ${BOOKS().length ? `<table class="dash" style="margin-top:10px"><thead><tr><th><input type="checkbox" ${keys.size && PICK.size===keys.size?"checked":""} onchange="pickAll(this.checked)" ${dis} title="모두"></th>
        <th>번호</th><th>절</th><th class="num">글자수</th><th>1 진단</th><th>2 윤문</th><th>3 감사</th><th>4 정오표</th></tr></thead><tbody>
        ${BOOKS().map(docRow).join("")}</tbody></table>`
        : `<div class="empty">아직 글이 없습니다. <a href="#/new">새 글 넣기</a>에서 넣으세요.</div>`}
      <div class="mute" style="margin-top:8px">칸의 「N구간」은 남은 Codex 호출 수입니다(마우스를 올리면 어림 시간). 「4 반영」은 정오표(엑셀 · 회의용 검토 PDF · 체크박스 검토 HTML · 게시판 HTML)를 책 전체 한 번에, 절 · 쪽 순으로 만듭니다.
        체크는 글 화면에서 고른 대로, 손대지 않았으면 수정확률 60% 이상이 들어갑니다.</div>
      ${bigWarn(STAGES.reduce((a,[k])=>a+leftSegs(sel, k), 0))}
      <div id="dlog"></div></div>
    <div class="card"><h2>엔진 · 사용 한도</h2>
      <div class="grid2">
        <span>엔진</span><div class="row">${engineSelect("")}<span class="mute">Codex(ChatGPT)가 기본입니다. 자동 = Codex로 하다가 한도에 걸리면 Claude로(Claude CLI에 로그인된 PC만).</span></div>
        <span>한도면</span><div class="row">최대 <input type="number" id="d_wait" min="0" max="48" step="1" value="${s.wait_hours}" style="width:70px" onchange="saveSettings({wait_hours:this.value})"> 시간까지 기다렸다가 이어서
          <span class="mute">0 = 기다리지 않고 바로 멈춤. 기다리는 동안 콘솔 창(run.bat)은 켜 두세요(PC 절전은 막습니다).</span></div>
      </div></div>`;
  document.querySelectorAll("[data-ind='1']").forEach(e => e.indeterminate = true);
  $("dlog").dataset.sig = ""; dashLog();
}
function dashLog(){
  const el = $("dlog"), j = APP.job; if(!el) return;
  if(!j.name){ el.innerHTML = ""; return }
  const sig = j.log.length+"|"+j.running+"|"+ALERT_OFF;
  if(el.dataset.sig === sig) return; el.dataset.sig = sig;
  const log = `<pre class="log">${esc(j.log.join("\n")||"시작 중…")}</pre>`;
  el.innerHTML = `<div style="margin-top:10px">` + jobAlert(j) + (j.running ? `<div class="bar"><i style="width:${progress(j)}%"></i></div>${log}`
    : `<details><summary class="mute">${j.error ? "⚠" : "✓"} ${esc(j.name)}${j.uid ? " · "+esc(j.uid) : ""} ${j.error ? "중단" : "끝"} (${esc(j.ended||"")}) — 로그 보기</summary>${log}</details>`) + `</div>`;
  const lg = el.querySelector(".log"); lg.scrollTop = lg.scrollHeight;
}
function pick(k, on){ on ? PICK.add(k) : PICK.delete(k); savePick(); renderDash() }
function pickDoc(id, on){ const d = BOOKS().find(x=>x.id===id); for(const pt of partsOf(d)) on ? PICK.add(pkey(d,pt)) : PICK.delete(pkey(d,pt)); savePick(); renderDash() }
function pickAll(on){ PICK = new Set(on ? BOOKS().flatMap(d => partsOf(d).map(pt => pkey(d, pt))) : []); savePick(); renderDash() }
function fold(id){ FOLD.has(id) ? FOLD.delete(id) : FOLD.add(id); rendered = null; renderDash() }
async function runSteps(steps){
  const items = BOOKS().filter(d => pickedParts(d).length).map(d => { const ps = partsOf(d), ks = pickedParts(d).map(pt=>pt.k);
    return {id:d.id, parts: ks.length === ps.length ? null : ks} });
  const sel = BOOKS().flatMap(d => pickedParts(d));
  const names = {detect:"진단", rewrite:"윤문", audit:"감사", export:"반영"};
  const n = steps.filter(st=>st!=="export").reduce((a,st)=>a+leftSegs(sel, st), 0);
  const m = steps.filter(st=>st!=="export").reduce((a,st)=>a+estMin(leftSegs(sel, st), st), 0);
  if(!confirm(`${items.length}편 ${sel.length}부분에 「${steps.map(s=>names[s]).join(" → ")}」을(를) 합니다.`
    + (n ? `\n호출 약 ${n}회 · Codex로 약 ${m}분 (어림)` : "") + "\n계속할까요?")) return;
  try{ await api("/api/batch",{method:"POST",body:JSON.stringify({items, steps})}); toast("시작했습니다. 창을 닫아도 계속 진행됩니다.", 5000); refresh() }
  catch(e){ toast(e.message, 8000) }
}
async function saveSettings(patch){
  try{ const j = await api("/api/settings",{method:"POST",body:JSON.stringify(patch)}); APP.settings = j.settings; rendered = null; renderNav(); renderView(); toast("저장했습니다.") }
  catch(e){ toast(e.message) }
}
function engineSelect(cls){
  return `<select class="${cls}" onchange="saveSettings({engine:this.value})" title="진단·윤문에 쓸 AI">${Object.entries(APP.engines).map(([k,v])=>`<option value="${k}" ${APP.settings.engine===k?"selected":""}>${esc(v)}</option>`).join("")}</select>`;
}
function updateJobBox(){
  const el = $("job"), j = APP.job; if(!el) return;
  if(!j.name || (j.uid !== DS.doc.id && !(isBatch(j) && APP.batch.ids.includes(DS.doc.id)))){ el.innerHTML = ""; return }
  const sig = j.log.length+"|"+j.running+"|"+ALERT_OFF;
  if(el.dataset.sig === sig) return; el.dataset.sig = sig;
  const log = `<pre class="log">${esc(j.log.join("\n")||"시작 중…")}</pre>`;
  el.innerHTML = jobAlert(j) + (j.running ? `<div class="bar"><i style="width:${progress(j)}%"></i></div>${log}`
    : `<details style="margin:6px 0"><summary class="mute">${j.error ? "⚠" : "✓"} ${esc(j.name)} ${j.error ? "중단" : "끝"} (${esc(j.ended||"")}) — 로그 보기</summary>${log}</details>`);
  const lg = el.querySelector(".log"); lg.scrollTop = lg.scrollHeight;
}

/* ---------- 작업할 책 (좌하단) — 나중에 워크스페이스처럼 쌓을 자리 ---------- */
function bookFoot(){
  if(!APP.docs.length) return "";
  const id = curId(), r = route();
  return `<div style="color:var(--rail-mute)">작업할 책</div><select class="engsel" onchange="pickBook(this.value)" title="작업할 책">
    ${[...APP.docs].reverse().map(x=>`<option value="${esc(x.id)}" ${x.id===id?"selected":""}>${esc(x.id)} · ${esc(x.title.slice(0,24))}</option>`).join("")}</select>`;
}
function pickBook(id){
  try{ localStorage.setItem("khum.doc", id) }catch(e){}
  const r = route();
  location.hash = r.view === "doc" ? "#/d/"+encodeURIComponent(id)+"/"+r.stage : r.view === "dash" ? "#/dash" : "#/d/"+encodeURIComponent(id)+"/setup";
  if(r.view === "dash"){ rendered = null; refresh() }
}

/* ---------- 엔진 · 계정 (좌하단): Codex(ChatGPT) · Claude ---------- */
const ACCT = {codex:{name:"Codex", who:"ChatGPT"}, claude:{name:"Claude", who:"Claude"}};
const MENU = {codex:false, claude:false}, SEEN = {};
function engineFoot(){ return `<div style="color:var(--rail-mute)">진단·윤문 엔진</div>${engineSelect("engsel")}` }
function acctFoot(k){
  const c = APP[k] || {}, A = ACCT[k], e = APP.settings.engine;
  const used = e === k || (e === "auto" && k === "codex");  // 쓰는 엔진이 막혔을 때만 메뉴를 저절로 연다
  if(used && c.verified === false && SEEN[k] !== c.checked_at){ MENU[k] = true; SEEN[k] = c.checked_at }
  const busy = c.checking || c.login_open;
  const dot = busy ? "⏳" : c.verified ? "🟢" : (c.verified === false || c.logged_in === false) ? "🔴" : "🟡";
  const head = c.installed === false ? `${A.name} 없음` : c.logged_in === false ? `${A.name} 로그인 필요`
    : c.verified === false ? `${A.name} 로그인 만료` : c.verified ? `${A.name} 정상` : `${A.name} 확인 필요`;
  return `<div class="cxbtn" onclick="MENU.${k}=!MENU.${k};renderNav()" title="눌러서 로그인 · 로그아웃 · 새로고침"><span>${dot} ${head}</span><span class="cxmail">${esc(c.email||"")}</span><span>${MENU[k]?"▾":"▸"}</span></div>
    ${MENU[k] ? `<div class="cxmenu">
      <div>${esc(c.message||"")}${c.checked_at ? ` <span style="opacity:.7">· ${esc(c.checked_at)}</span>` : ""}</div>
      <div class="row" style="gap:4px;margin-top:6px">
        <button onclick="acctAct('${k}','refresh')" ${busy?"disabled":""} title="로그인 상태 + 실제로 한 번 짧게 불러 봅니다 (10~30초)">새로고침</button>
        <button onclick="acctAct('${k}','login')" ${busy||c.installed===false?"disabled":""}>로그인</button>
        <button onclick="acctAct('${k}','logout')" ${busy||c.installed===false?"disabled":""}>로그아웃</button>
      </div></div>` : ""}`;
}
async function acctAct(k, what){
  const A = ACCT[k];
  if(what==="logout" && !confirm(`이 PC의 ${A.name} 로그인을 해제할까요? (다시 [로그인]해야 ${A.name}로 윤문할 수 있습니다)`
    + (k==="claude" ? "\n\n※ 이 PC의 Claude Code(claude 명령)도 같이 로그아웃됩니다." : ""))) return;
  if(what==="login") return k==="codex" ? codexLogin(true) : acctLogin(k);
  try{ await api(`/api/${k}/${what}`,{method:"POST"}); toast(what==="refresh" ? `${A.name}를 실제로 불러 보는 중입니다 (10~30초)` : "로그아웃했습니다."); refresh() }catch(e){ toast(e.message, 8000) }
}
async function acctLogin(k){
  try{ await api(`/api/${k}/login`,{method:"POST",body:"{}"});
    MENU[k] = true; toast(`새 창과 브라우저가 열립니다. ${ACCT[k].who} 계정으로 로그인하세요. 끝나면 자동으로 확인합니다.`, 9000); refresh()
  }catch(e){ toast(e.message, 8000) }
}
async function codexLogin(relogin){
  try{ await api("/api/codex/login",{method:"POST",body:JSON.stringify({relogin: relogin===true})});
    MENU.codex = true; toast("새 창과 브라우저가 열립니다. ChatGPT 계정으로 로그인하세요. 끝나면 자동으로 확인합니다.", 9000); refresh()
  }catch(e){ toast(e.message, 8000) }
}
function copyLogin(){ navigator.clipboard.writeText("codex logout && codex login").then(()=>toast("복사했습니다. 명령창에 붙여 넣으세요.")) }

refresh();
</script>
</body></html>
